:root{
  --base:#EDEBE9; --ink:#1A1A1A; --ink2:#55514b; --paper:#F6F4F1;
  --yel:#F7D128; --per:#978CE1; --ide:#F928BE;
  --serif:Baskerville,'Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:'Montserrat',Avenir,'Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;cursor:none;}
body{font-family:var(--sans);background:var(--base);color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none;}
.mesh{position:fixed;top:-20%;left:-20%;right:-20%;bottom:-20%;z-index:0;
  background:
    radial-gradient(58% 68% at 12% 8%,  var(--per) 0%, transparent 62%),
    radial-gradient(50% 60% at 88% 14%, #E9E6FD 0%, transparent 65%),
    radial-gradient(55% 65% at 10% 96%, var(--yel) 0%, transparent 60%),
    radial-gradient(45% 60% at 90% 90%, var(--ide) 0%, transparent 66%),
    var(--base);
  animation:drift 30s ease-in-out infinite alternate;}
@keyframes drift{from{transform:translate3d(-1.5%,-1%,0) scale(1)}to{transform:translate3d(1.5%,2%,0) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.mesh{animation:none;}}

.view{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4vmin;opacity:0;visibility:hidden;transition:opacity .9s ease;}
.view.on{opacity:1;visibility:visible;}

/* ===== vista RANKING ===== */
.rk-head{display:flex;flex-direction:column;align-items:center;gap:.6vmin;margin-bottom:3vmin;}
.rk-logo{font-family:var(--serif);font-style:italic;font-weight:600;font-size:5.4vmin;line-height:1;}
.rk-logo .star{font-style:normal;font-size:.45em;vertical-align:.7em;}
.rk-sub{font-size:1.9vmin;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);}
.rows{display:flex;flex-direction:column;gap:1.3vmin;width:min(86vw,150vmin);}
.brow{display:flex;align-items:center;gap:2.4vmin;background:rgba(255,255,255,.92);border-radius:2.2vmin;
  padding:1.5vmin 3vmin;box-shadow:0 .5vmin 2.4vmin -1vmin rgba(26,26,26,.3);
  opacity:0;transform:translateY(2.5vmin);}
.view.on .brow{animation:rowin .55s ease forwards;}
@keyframes rowin{to{opacity:1;transform:none}}
.brow .rk{font-weight:700;font-size:3.4vmin;width:2.2em;text-align:center;color:var(--ink2);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.brow .nm{font-weight:600;font-size:3.4vmin;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brow .lv{font-weight:700;font-size:2vmin;letter-spacing:.12em;text-transform:uppercase;background:var(--yel);
  border-radius:99px;padding:1vmin 2.4vmin;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto;}
.brow.top1{transform:scale(1.03) translateY(2.5vmin);}
.brow.top1 .nm,.brow.top1 .rk{font-size:4vmin;}
.brow.reciente{outline:.45vmin solid var(--per);}
.rk-foot{margin-top:3vmin;font-size:2vmin;font-weight:600;color:var(--ink2);display:flex;gap:3vmin;align-items:center;}
.rk-cta{background:var(--ink);color:#fff;border-radius:99px;padding:1.2vmin 3vmin;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;font-size:1.8vmin;}
.empty{text-align:center;display:flex;flex-direction:column;gap:2vmin;align-items:center;}
.empty .big{font-family:var(--serif);font-style:italic;font-weight:600;font-size:6vmin;max-width:26ch;}
.empty .sub2{font-size:2.6vmin;font-weight:600;color:var(--ink2);}

/* ===== vista PLACA ===== */
#placaimg{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;display:none;}
.placa-fallback{display:flex;flex-direction:column;align-items:center;gap:3vmin;text-align:center;}
.placa-fallback .lg{font-family:var(--serif);font-style:italic;font-weight:600;font-size:9vmin;line-height:1.05;}
.placa-fallback .cl{font-size:3vmin;font-weight:500;color:var(--ink2);max-width:34ch;}
.placa-fallback .shapes{width:34vmin;}
.placa-fallback .cta2{background:var(--ink);color:#fff;border-radius:99px;padding:1.6vmin 4vmin;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;font-size:2.2vmin;}

/* ===== vista INVITACIÓN (placa Level Up + jugá en el tótem) ===== */
.inv{display:flex;flex-direction:column;align-items:center;gap:2vmin;text-align:center;}
.inv-ilus svg{width:46vmin;height:auto;display:block;margin:-3vmin 0 -5vmin;animation:invbob 1.1s steps(2,end) infinite;}
@keyframes invbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2%)}}
.inv-cta{background:var(--ink);color:#fff;border-radius:99px;padding:2.2vmin 6vmin;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;font-size:3.6vmin;}
.inv-sub{font-size:2.6vmin;font-weight:600;color:var(--ink2);}
@media (prefers-reduced-motion:reduce){.inv-ilus svg{animation:none;}}

/* ===== vista CELEBRACIÓN (level up en la LED) ===== */
#vWin{transition-duration:.35s;}
.winbox{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(60% 45% at 50% 50%,rgba(247,209,40,.6) 0%,rgba(247,209,40,0) 75%);}
.win-center{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;
  animation:winpop .5s steps(5,end) both;}
@keyframes winpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.win-ilus svg{width:52vmin;height:auto;display:block;margin:-4vmin 0 -6vmin;}
.win-sub{font-weight:700;font-size:4.6vmin;color:var(--ink);text-align:center;}
.win-sub b{background:var(--yel);border-radius:99px;padding:.2em .7em;}
.win-logo svg{width:36vmin;height:auto;display:block;opacity:0;animation:winlogo .4s .4s ease forwards;}
@keyframes winlogo{to{opacity:1}}
.cf{position:absolute;top:-6vh;animation:cffall steps(12,end) forwards;}
@keyframes cffall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none;}.win-center{animation:none;}}

<section class="view" id="vWin"><div id="winbox" class="winbox"></div></section>

<script>
/* ===== configuración por URL: ?ranking=12&placa=8&top=10 ===== */
const Q=new URLSearchParams(location.search);
const DUR_RANK=(parseInt(Q.get('ranking'))||12)*1000;
const DUR_PLACA=(parseInt(Q.get('placa'))||8)*1000;
const TOP=parseInt(Q.get('top'))||10;
const LS='hf404_scores_v1';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function load(){if(mirror)return mirror.scores;try{return JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){return{}}}

/* Tabla de muestra: SOLO para previews con ?demo=1 (en la LED siempre datos reales). */
const DEMO=[['Satoshi N.',21],['Anonymous',17],['Steve J.',14],['Grace H.',11],
  ['Jeff B.',9],['Elon M.',7],['Ada L.',5],['Bill G.',4]];
const DEMO_MODE=Q.get('demo');

function ranking(){
  const sc=load();
  return Object.entries(sc).map(([name,s])=>({name,lv:s.lv||0,played:s.played||0,t:s.t||''}))
    .sort((a,b)=>b.lv-a.lv||a.played-b.played||a.name.localeCompare(b.name,'es'));
}
function medal(i){return i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'º';}

function render(){
  let r=ranking(),demo=false;
  if(DEMO_MODE==='1'){
    r=DEMO.map(([name,lv])=>({name,lv,t:''}));demo=true;
  }
  const rows=document.getElementById('rows'),foot=document.getElementById('foot');
  if(r.length===0){
    rows.innerHTML=`<div class="empty"><div class="big">“No hay respuestas sin buenas preguntas.”</div>
      <div class="sub2">Todavía no jugó nadie — ¡estrená el ranking!</div></div>`;
    foot.innerHTML=`<span class="rk-cta">Jugá en el tótem 🧀</span>`;
    return;
  }
  const last=demo?null:r.slice().sort((a,b)=>(b.t||'').localeCompare(a.t||''))[0];
  rows.innerHTML=r.slice(0,TOP).map((p,i)=>
    `<div class="brow top${i+1}${last&&p.name===last.name?' reciente':''}" style="animation-delay:${i*70}ms">
      <span class="rk">${medal(i)}</span><span class="nm">${esc(p.name)}</span>
      <span class="lv">Nivel ${p.lv}</span></div>`).join('');
  foot.innerHTML=demo
    ?`<span>Tabla de ejemplo · los primeros en jugar la estrenan</span><span class="rk-cta">Jugá en el tótem 🧀</span>`
    :`<span>${r.length} ${r.length===1?'jugador':'jugadores'}</span>`+
     (last&&last.t?`<span>· último en jugar: <b>${esc(last.name)}</b></span>`:'')+
     `<span class="rk-cta">Sumate en el tótem 🧀</span>`;
}

/* ===== placa (imagen del cliente con fallback de marca) ===== */
const img=document.getElementById('placaimg');
const PLACAS=['placa.png','placa.jpg'];let pi=0;
img.onload=()=>{img.style.display='block';document.getElementById('placaFb').style.display='none';};
img.onerror=()=>{pi++;if(pi<PLACAS.length){img.src=PLACAS[pi]+'?v='+Date.now();}else{img.style.display='none';document.getElementById('placaFb').style.display='flex';}};
img.src=PLACAS[0]+'?v='+Date.now();
setInterval(()=>{pi=0;img.src=PLACAS[0]+'?v='+Date.now();},10*60*1000); /* re-busca la placa cada 10 min */

/* =====================================================================
   MÁQUINA DE ESTADOS DE LA PANTALLA LED
   · Reposo: PLACA casi todo el tiempo (si hay jugadores reales, ranking breve cada tanto)
   · Alguien jugando (latido del tótem <3 min): RANKING dominante, placa breve
   · Acierto en el tótem: CELEBRACIÓN "LEVEL UP" → ranking → sigue el loop
   Config URL (segundos): ?rankon=20&placaon=8&idlerank=8&idleplaca=50&win=5
   ===================================================================== */
const CFG={
  rankOn:(parseInt(Q.get('rankon'))||20)*1000,
  placaOn:(parseInt(Q.get('placaon'))||8)*1000,
  idleRank:(parseInt(Q.get('idlerank'))||8)*1000,
  idlePlaca:(parseInt(Q.get('idleplaca'))||50)*1000,
  winMs:(parseInt(Q.get('win'))||5)*1000,
  inviteOn:(parseInt(Q.get('invite'))||7)*1000,
  activeVentana:3*60*1000
};
const vR=document.getElementById('vRank'),vP=document.getElementById('vPlaca'),vW=document.getElementById('vWin'),vI=document.getElementById('vInvite');
let mode='placa',modeUntil=0,seqIdx=0,lastWinShown=0;
try{var _il=document.getElementById('lvlIlusTpl');if(_il)document.getElementById('invIlus').innerHTML=_il.innerHTML;}catch(e){}

function isActive(){if(mirror)return (Date.now()-mirror.rx)<CFG.activeVentana;try{return Date.now()-(parseInt(localStorage.getItem('hf404_active'))||0)<CFG.activeVentana}catch(e){return false}}
function hasReal(){return ranking().length>0||DEMO_MODE==='1';}

function setView(which){
  [vR,vP,vW,vI].forEach(v=>v.classList.remove('on'));
  if(which==='rank'){render();void vR.offsetWidth;vR.classList.add('on');}
  else if(which==='placa'){vP.classList.add('on');}
  else if(which==='invite'){vI.classList.add('on');}
  else if(which==='win'){vW.classList.add('on');}
}
function enter(m,dur){mode=m;modeUntil=Date.now()+dur;setView(m);}

function checkWin(){
  if(pendingWin){var pw=pendingWin;pendingWin=null;lastWinShown=pw.ts;playWin(pw);return true;}
  try{
    const w=JSON.parse(localStorage.getItem('hf404_lastwin')||'null');
    if(w&&w.ts>lastWinShown&&Date.now()-w.ts<15000){
      lastWinShown=w.ts;playWin(w);return true;
    }
  }catch(e){}
  return false;
}
function playWin(w){
  const ilus=document.getElementById('lvlIlusTpl'),logo=document.getElementById('lvlLogoTpl');
  let cf='';
  const CFCOL=['#FAE428','#F5CC06','#ABA0FB','#6F64B9','#FCEF7E','#F0B601'];
  for(let i=0;i<36;i++){
    const c=CFCOL[i%CFCOL.length],l=Math.random()*100,d=(Math.random()*.5).toFixed(2),
      t=(1.5+Math.random()*1.2).toFixed(2),s=(.6+Math.random()*1).toFixed(2);
    cf+=`<span class="cf" style="left:${l}%;background:${c};width:${s}vmin;height:${s}vmin;animation-duration:${t}s;animation-delay:${d}s"></span>`;
  }
  document.getElementById('winbox').innerHTML=`${cf}
    <div class="win-center">
      <div class="win-ilus">${ilus?ilus.innerHTML:''}</div>
      <div class="win-sub">¡${esc(w.name)} alcanzó el <b>Nivel ${w.lv}</b>!</div>
      <div class="win-logo">${logo?logo.innerHTML:''}</div>
    </div>`;
  enter('win',CFG.winMs);
}

function tick(){
  if(mode!=='win'&&checkWin())return;
  if(Date.now()<modeUntil)return;
  if(mode==='win'){enter('rank',15000);seqIdx=0;return;}
  var seq;
  if(isActive()&&hasReal())seq=[['rank',CFG.rankOn],['placa',CFG.placaOn],['invite',CFG.inviteOn]];
  else if(hasReal())seq=[['placa',CFG.idlePlaca],['invite',CFG.inviteOn],['rank',CFG.idleRank]];
  else seq=[['placa',30000],['invite',CFG.inviteOn]];
  var paso=seq[seqIdx%seq.length];seqIdx++;
  if(paso[0]===mode){paso=seq[seqIdx%seq.length];seqIdx++;}
  enter(paso[0],paso[1]);
}
enter('placa',2000);
setInterval(tick,400);

/* ===== FEED desde el tótem (otra PC) vía relay ntfy.sh — solo nombres y niveles ===== */
const FEED_TOPIC='hf404-bigcheese-x7k2m9q4';
const FEED_ON=Q.get('feed')!=='off';
let mirror=null,pendingWin=null,lastFeedWinTs=0;
function applyFeed(msg,inicial){
  try{
    var d=JSON.parse(msg);
    if(d&&d.t==='state'&&d.scores){
      var sc={};
      for(var i=0;i<d.scores.length;i++){sc[d.scores[i][0]]={lv:d.scores[i][1],played:0,t:''};}
      mirror={scores:sc,rx:Date.now()};
      if(d.win&&d.win.ts&&d.win.ts!==lastFeedWinTs){
        lastFeedWinTs=d.win.ts;
        if(!inicial)pendingWin=d.win;
      }
      if(mode==='rank')render();
    }
  }catch(e){}
}
function feedPoll(rango,inicial){
  fetch('https://ntfy.sh/'+FEED_TOPIC+'/json?poll=1&since='+rango).then(function(r){return r.text()}).then(function(t){
    var lines=t.trim().split('\n');
    for(var i=lines.length-1;i>=0;i--){
      try{var e=JSON.parse(lines[i]);if(e.event==='message'){applyFeed(e.message,inicial);break;}}catch(x){}
    }
  }).catch(function(){});
}
if(FEED_ON){
  feedPoll('12h',true);
  try{
    var es=new EventSource('https://ntfy.sh/'+FEED_TOPIC+'/sse');
    es.onmessage=function(ev){try{var e=JSON.parse(ev.data);if(e.event==='message')applyFeed(e.message,false);}catch(x){}};
    es.onerror=function(){};
  }catch(e){}
  setInterval(function(){feedPoll('2m',false);},15000);
}

/* ===== datos frescos: evento de storage (misma compu) + refresco periódico ===== */
window.addEventListener('storage',e=>{
  if(e.key==='hf404_lastwin'){if(mode!=='win')checkWin();}
  if(e.key===LS&&mode==='rank')render();
});
setInterval(()=>{if(mode==='rank')render();},5000);

/* ===== TV: pantalla siempre despierta + recarga de higiene cada 6 h ===== */
let wl=null;
async function wake(){try{wl=await navigator.wakeLock.request('screen');}catch(e){}}
wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});
const bootT=Date.now();
setInterval(()=>{if(Date.now()-bootT>6*3600*1000&&!showingRank)location.reload();},60000);
</script>
